<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1225"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="RideCheck"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><title>RideCheck</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}*{box-sizing:border-box}html{min-height:100%;background:#090f21}body{margin:0;background:#090f21;color:#f8fafc;min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 12px) max(10px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 12px) max(10px,env(safe-area-inset-left))}main{width:100%;max-width:540px;margin:auto}.top{height:36px;display:flex;justify-content:flex-end;align-items:center;margin-bottom:8px}button{border:1px solid #41536d;background:#182339;color:#e7efff;border-radius:9px;font-size:14px;font-weight:700;padding:7px 16px;min-height:34px;touch-action:manipulation}.panel{border-radius:21px;background:#0e172b;padding:14px;overflow:hidden}.inputs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.field{background:#19243a;border-radius:15px;min-width:0;min-height:93px;padding:16px 13px 10px}.field label{display:block;font-size:14px;font-weight:400;color:#cdd8ea;white-space:nowrap;letter-spacing:-.2px}.field input{display:block;width:100%;min-width:0;background:transparent;color:white;border:0;outline:none;font-size:25px;font-weight:700;padding:8px 0 0;line-height:1.3;border-radius:0;appearance:textfield;-webkit-appearance:none}.field input::placeholder{color:#7888a7;opacity:1}.field input::-webkit-inner-spin-button,.field input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.results{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin-top:10px;border-radius:14px;overflow:hidden;gap:2px;background:#091b22}.result{background:#103d30;min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 4px;min-width:0}.result.bad{background:#4a202b}.result.neutral{background:#173044}.result .label{color:#6ee7b7;font-size:11px;font-weight:750;white-space:nowrap}.result .value{color:#6ee7b7;font-size:25px;font-weight:750;line-height:1.25;margin-top:10px;white-space:nowrap}.result.bad .label,.result.bad .value{color:#fda4af}.result.neutral .label,.result.neutral .value{color:#b9cee3}button:focus-visible,input:focus-visible{outline:2px solid #6ee7b7;outline-offset:3px}@media(max-width:375px){.panel{padding:10px}.inputs{gap:8px}.field{padding:13px 10px;min-height:88px}.field label{font-size:12px}.field input{font-size:24px}.result .label{font-size:10px}.result .value{font-size:23px}}@media(min-width:600px){main{margin:24px auto}}
</style></head><body><main><div class="top"><button id="reset" type="button">↻ Reset</button></div><div class="panel"><div class="inputs"><div class="field"><label for="offer">Offer ($)</label><input id="offer" type="number" inputmode="decimal" min="0" step="any" placeholder="0.00" autocomplete="off"></div><div class="field"><label for="miles">Total Miles (A → B)</label><input id="miles" type="number" inputmode="decimal" min="0" step="any" placeholder="0.0" autocomplete="off"></div></div><div class="results" aria-live="polite"><div class="result neutral" id="deadBox"><span class="label">MAX DEAD MILES</span><strong class="value" id="dead">—</strong></div><div class="result neutral" id="hourBox"><span class="label">EST. $ / HR</span><strong class="value" id="hour">—</strong></div></div></div></main><script>
(()=>{'use strict';const RATE=.85,MPH=30;const offer=document.getElementById('offer'),miles=document.getElementById('miles'),dead=document.getElementById('dead'),hour=document.getElementById('hour'),deadBox=document.getElementById('deadBox'),hourBox=document.getElementById('hourBox');function calc(){const a=Number(offer.value),b=Number(miles.value),ok=offer.value.trim()!==''&&miles.value.trim()!==''&&Number.isFinite(a)&&Number.isFinite(b)&&a>0&&b>0;if(!ok){dead.textContent='—';hour.textContent='—';deadBox.className='result neutral';hourBox.className='result neutral';return}const max=a/RATE,remaining=max-b,good=remaining>=0;dead.textContent=(good?Math.floor((remaining+1e-9)*100)/100:0).toFixed(2)+' mi';hour.textContent='$'+(a*MPH/(good?max:b)).toFixed(2);deadBox.className='result '+(good?'':'bad');hourBox.className='result '+(good?'':'bad')}offer.addEventListener('input',calc);miles.addEventListener('input',calc);document.getElementById('reset').addEventListener('click',()=>{offer.value='';miles.value='';calc();offer.focus()});calc();if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))})();
</script></body></html>
